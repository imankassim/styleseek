name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-unit-tests:
    # Only the hermetic suite (tests/unit) — no DATABASE_URL/OPENSEARCH_URL secret is configured
    # for this repo, so data_quality/integration/search_regression/sync/drift (all of which need
    # the live Neon/OpenSearch project) don't run here. A deliberate scope choice, not an
    # oversight: those credentials are free-tier personal accounts (see database/.env, git-
    # ignored), and wiring them into GitHub Actions secrets is a decision for the repo owner, not
    # something to do unasked. See docs/progress.md Stage 15 notes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest tests/unit -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker-build-smoke-test:
    # Builds both images as a smoke test (catches a broken Dockerfile before it's needed for a
    # real deploy) -- does not push anywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t styleseek-backend:ci .
      - run: docker build -f frontend/Dockerfile -t styleseek-frontend:ci .
